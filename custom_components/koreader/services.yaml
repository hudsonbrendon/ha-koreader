show_message:
  name: Mostrar mensagem
  description: Enfileira uma mensagem para ser exibida na tela do Kindle no próximo check-in do KOReader.
  fields:
    message:
      name: Mensagem
      description: Texto a exibir no Kindle.
      required: true
      example: "Hora de dormir!"
      selector:
        text:
    timeout:
      name: Tempo (s)
      description: Segundos que a mensagem fica na tela (1-120).
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s

go_to_page:
  name: Ir para página
  description: Enfileira um comando para o KOReader saltar para uma página específica no próximo check-in.
  fields:
    page:
      name: Página
      description: Número da página de destino (a partir de 1).
      required: true
      example: 50
      selector:
        number:
          min: 1
