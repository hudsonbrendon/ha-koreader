rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Push-only; the device posts telemetry to a webhook, nothing is polled.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Webhook flow; there is no connection to test before creating the entry.
  test-before-setup:
    status: exempt
    comment: Webhook flow; setup only registers the webhook and cannot fail against the device.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: There are no options to configure.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Webhook flow; there are no credentials to renew.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The device pushes to a webhook; it cannot be discovered on the network.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One config entry is one KOReader device.
  entity-category: todo
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow:
    status: exempt
    comment: There is nothing to reconfigure; the webhook id is generated.
  repair-issues:
    status: exempt
    comment: Nothing can be repaired from Home Assistant's side.
  stale-devices:
    status: exempt
    comment: One config entry is one device; removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: pykoreader only parses payloads and builds commands; it makes no HTTP requests.
  strict-typing: todo
