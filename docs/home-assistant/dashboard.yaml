title: Kindle
views:
  - title: Kindle
    cards:
      - type: entities
        title: Livro
        entities:
          - binary_sensor.koreader_reading
          - sensor.koreader_book_title
          - sensor.koreader_book_author
          - sensor.koreader_book_series
          - sensor.koreader_book_format
          - sensor.koreader_book_language
          - sensor.koreader_chapter
          - sensor.koreader_current_page
          - sensor.koreader_total_pages
          - sensor.koreader_pages_left
          - sensor.koreader_pages_left_in_chapter
          - sensor.koreader_time_to_finish_book
          - sensor.koreader_time_to_finish_chapter
          - sensor.koreader_estimated_finish_date
          - sensor.koreader_annotations
          - sensor.koreader_highlights
          - sensor.koreader_notes
      - type: entities
        title: Controle
        entities:
          - binary_sensor.koreader_status
          - sensor.koreader_last_check_in
          - binary_sensor.koreader_charging
          - switch.koreader_wifi
          - switch.koreader_frontlight
          - switch.koreader_dark_mode
          - number.koreader_frontlight
          - number.koreader_warmth
          - button.koreader_force_sync
          - button.koreader_next_page
          - button.koreader_previous_page
          - button.koreader_next_chapter
          - button.koreader_previous_chapter
          - button.koreader_toggle_bookmark
          - button.koreader_refresh_screen
          - button.koreader_suspend
          - button.koreader_restart
      - type: gauge
        entity: sensor.koreader_progress
        name: Progresso
        unit: "%"
        min: 0
        max: 100
      - type: gauge
        entity: sensor.koreader_battery
        name: Bateria
        unit: "%"
        min: 0
        max: 100
      - type: history-graph
        title: Leitura
        hours_to_show: 168
        entities:
          - sensor.koreader_reading_time_today
          - sensor.koreader_pages_read_today
          - sensor.koreader_reading_speed
          - sensor.koreader_total_reading_time
